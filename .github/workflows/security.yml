name: Security

on:
  push:
    branches: [main, master, develop]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"   # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-deps:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.7.3
      # Advisory for now: a new CVE in a transitive dependency must not block
      # unrelated PRs. The weekly scheduled run is the signal to act on.
      # Tighten to blocking once the backlog is at zero (R-39).
      - name: pip-audit
        run: pip-audit -r backend/requirements.txt
        continue-on-error: true

  node-deps:
    name: npm dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Advisory for now — see the note on pip-audit above (R-39).
      - name: npm audit (high/critical)
        run: npm audit --audit-level=high
        continue-on-error: true

  # CodeQL is NOT defined here on purpose.
  #
  # Running an advanced CodeQL workflow while GitHub's "default setup" is
  # enabled for the repository makes every run fail with a SARIF upload
  # conflict. Default setup covers python and javascript-typescript with no
  # workflow to maintain, so use that instead:
  #   Settings -> Code security -> Code scanning -> CodeQL -> Default
  # If you ever need custom queries, disable default setup first, then add
  # the codeql job back here.

  container-scan:
    name: Container image scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t billing-backend:scan ./backend
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: billing-backend:scan
          format: sarif
          output: trivy-backend.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

  iac-and-config:
    name: Static security checks (bandit · semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit[toml]==1.7.10
      - name: Bandit
        run: bandit -r backend/app -ll -x backend/app/seed.py
      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/python
            p/react
            p/secrets
            p/owasp-top-ten
        continue-on-error: true
