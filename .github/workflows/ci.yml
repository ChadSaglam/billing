name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend (lint · migrations · tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: billing_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d billing_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/billing_test
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/billing_test
      SECRET_KEY: ci-only-secret-not-used-in-production
      ALLOWED_ORIGINS: http://localhost:5173
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install system libs (weasyprint / psycopg2)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpq-dev libcairo2 libpango-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check app tests

      - name: Ruff format check
        run: ruff format --check app tests
        continue-on-error: true

      - name: Alembic upgrade head
        run: alembic upgrade head

      - name: Alembic downgrade is reversible
        run: |
          alembic downgrade -1
          alembic upgrade head

      - name: Detect model/migration drift
        run: |
          alembic revision --autogenerate -m "ci-drift-check" -o /tmp/drift 2>/dev/null || true
          if grep -rqE "op\.(add_column|drop_column|create_table|drop_table|alter_column)" alembic/versions/*ci-drift-check* 2>/dev/null; then
            echo "::warning::Models and migrations have drifted — an autogenerate produced changes."
          fi
          rm -f alembic/versions/*ci-drift-check* || true

      - name: Pytest
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  frontend:
    name: Frontend (typecheck · lint · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src/

      - name: Production build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8001

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  docker:
    name: Docker build & compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: billing-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: billing-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write CI .env
        run: |
          cat > .env <<'ENVEOF'
          APP_ENV=development
          POSTGRES_USER=chadev
          POSTGRES_PASSWORD=ci-password
          POSTGRES_DB=billing
          DB_PORT=9202
          BACKEND_PORT=9201
          FRONTEND_PORT=9200
          SECRET_KEY=ci-only-secret-not-used-in-production
          ALLOWED_ORIGINS=http://localhost:9200
          FRONTEND_URL=http://localhost:9200
          VITE_API_URL=http://localhost:9201
          ENVEOF

      - name: docker compose config is valid
        run: docker compose config >/dev/null

      - name: Boot the stack
        id: boot
        run: |
          set +e
          docker compose up -d --wait --wait-timeout 300
          status=$?
          if [ $status -ne 0 ]; then
            echo "::group::backend logs"; docker compose logs backend --no-color; echo "::endgroup::"
            echo "::group::db logs";      docker compose logs db --no-color | tail -30; echo "::endgroup::"
            echo "::group::frontend logs";docker compose logs frontend --no-color; echo "::endgroup::"
            echo "::group::container state"; docker compose ps -a; echo "::endgroup::"
            echo "::group::backend inspect"
            docker inspect --format '{{json .State.Health}}' "$(docker compose ps -q backend)" | python3 -m json.tool
            echo "::endgroup::"
          fi
          exit $status

      - name: Backend is healthy and migrated
        run: |
          curl -fsS http://localhost:9201/api/health | tee /tmp/health.json
          python3 - <<'PY'
          import json
          h = json.load(open("/tmp/health.json"))
          assert h["database"] == "connected", h
          # The entrypoint runs `alembic upgrade head`, so a fresh container
          # must report a migration revision — not "none".
          assert h["migration"] not in ("none", "unknown"), h
          print("health ok:", h["status"], "migration:", h["migration"])
          PY

      - name: Frontend is serving
        run: curl -fsS http://localhost:9200 | head -c 200

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
