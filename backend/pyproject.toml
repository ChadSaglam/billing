[project]
name = "billing-backend"
version = "3.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["venv", ".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM"]
ignore = [
  "E501",   # line length is handled by the formatter
  "B008",   # FastAPI Depends() in defaults is the whole idiom
  "S101",   # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]   # hardcoded test passwords are intentional
"app/seed.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = ["db: needs a live PostgreSQL"]
