[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["venv", ".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
# backend/alembic/ is a migrations directory, not our package. Without this,
# ruff classifies `from alembic import command` as first-party and
# `from alembic.config import Config` as third-party, and asks for them in
# two different blocks.
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"app/seed.py" = ["S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
