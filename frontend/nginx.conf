# Production frontend (R-20): static SPA + same-origin API proxy.
# Expects a backend reachable as http://backend:8000 (compose network).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA fallback: unknown paths serve the app, the client router resolves.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite's hashed build artifacts are immutable — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Same-origin API: the browser never needs to know where the backend
    # lives, and CORS drops out of the picture entirely.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Uploaded logos are served by the backend.
    location /uploads/ {
        proxy_pass http://backend:8000;
        expires 7d;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
